# Render Blueprint: both services on the free plan.
# Secrets are generated by Render or entered in its dashboard, never committed.
# After Vercel gives you a URL, replace the two change-me values in the dashboard.
services:
  - type: web
    name: sponsorwise-api
    runtime: node
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: ACCESS_TOKEN_EXPIRY
        value: 15m
      - key: REFRESH_TOKEN_EXPIRY
        value: 7d
      - key: ACCESS_TOKEN_SECRET
        generateValue: true
      - key: REFRESH_TOKEN_SECRET
        generateValue: true
      - key: ML_API_KEY
        generateValue: true
      - key: CLIENT_ORIGIN
        value: https://change-me.vercel.app
      - key: ML_API_URL
        value: https://sponsorwise-ml.onrender.com
      - key: DATABASE_URI
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false

  - type: web
    name: sponsorwise-ml
    runtime: python
    plan: free
    region: singapore
    rootDir: ml-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: SERVICE_API_KEY
        fromService:
          type: web
          name: sponsorwise-api
          envVarKey: ML_API_KEY
      - key: ALLOWED_ORIGINS
        value: https://change-me.vercel.app
      - key: GROQ_API_KEY
        sync: false
